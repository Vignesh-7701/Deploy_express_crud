name: Node.js CI Pipeline

# 1. THE TRIGGER: When should this pipeline run?
on:
  push:
    branches: [ "main", "master" ]

# 2. THE JOBS: What should the pipeline do?
jobs:
  test-app:
    # We tell GitHub to spin up a fresh, blank Linux machine for us
    runs-on: ubuntu-latest
    # 3. THE STEPS: The exact commands to run on that Linux machine
    steps:
      # Step A: Download our code from the GitHub repository onto this machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Install Node.js on this machine
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      # Step C: Install our dependencies (Express, Jest, etc.)
      - name: Install Dependencies
        run: npm install

      # Step D: Run our tests!
      - name: Run Jest Tests
        run: npm test

  # --- JOB 2: BUILD AND PUSH TO DOCKER HUB ---
  build-and-push:
    needs: test-app # CRITICAL: This tells GitHub to wait. If tests fail, it will NOT push a broken image!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Log into Docker Hub using the secrets we just created
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build the image and push it to your Docker Hub account
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/deploy_express_crud:latest

  # --- JOB 3: DEPLOY TO AWS ---
  deploy:
    needs: build-and-push  # FIX: We changed this to match the name of Job 2!
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd express_app
            sudo docker compose pull
            sudo docker compose up -d